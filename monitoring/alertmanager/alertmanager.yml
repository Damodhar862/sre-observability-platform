route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="page"']
      receiver: default
      repeat_interval: 1h

# Alerts are visible in the UI at http://localhost:9093.
# For Slack: create an Incoming Webhook, then replace the receiver below
# with the commented block (never commit the real webhook URL).
receivers:
  - name: default
#  - name: default
#    slack_configs:
#      - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
#        channel: "#alerts"
#        send_resolved: true
#        title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
#        text: '{{ range .Alerts }}{{ .Annotations.summary }} - runbook: {{ .Annotations.runbook }}{{ "\n" }}{{ end }}'

inhibit_rules:
  # If the whole service is down, don't also page for its errors/latency.
  - source_matchers: ['alertname="OrdersServiceDown"']
    target_matchers: ['severity="page"']
