name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  validate-monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus config and SLO rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager config
        run: |
          docker run --rm -v "$PWD/monitoring/alertmanager:/etc/alertmanager" \
            --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

  build:
    needs: [test, validate-monitoring]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t orders-service:${{ github.sha }} .
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 orders-service:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
